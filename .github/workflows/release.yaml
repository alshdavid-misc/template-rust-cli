name: Release

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - "main"

jobs:
  version:
    name: 🌐 Auto Version Increment
    runs-on: ubuntu-24.04
    outputs:
      VERSION: ${{ steps.generate.outputs.VERSION }}
      GITHUB_REPOSITORY_NAME: ${{ steps.generate.outputs.GITHUB_REPOSITORY_NAME }}
      GITHUB_REPOSITORY: ${{ steps.generate.outputs.GITHUB_REPOSITORY }}
    steps:
      - id: generate
        run: |
          set -ex

          GITHUB_URL="https://api.github.com/repos/${{ github.repository }}"
          LAST_VERSION=$(curl -sSL "$GITHUB_URL/releases/latest" | jq -r '.tag_name // empty')

          if [ -z "$LAST_VERSION" ]; then
            # No releases yet
            NEW_VERSION="0.0.1"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "Bumping ${LAST_VERSION:-<none>} -> $NEW_VERSION"

          GITHUB_REPOSITORY_NAME="${GITHUB_REPOSITORY#*/}"

          echo $NEW_VERSION
          echo $GITHUB_REPOSITORY
          echo $GITHUB_REPOSITORY_NAME

          echo "VERSION=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "GITHUB_REPOSITORY_NAME=$GITHUB_REPOSITORY_NAME" >> "$GITHUB_OUTPUT"
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY" >> "$GITHUB_OUTPUT"

  test:
    name: 🧪 Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  format:
    name: 📝 Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-xfmt
      - run: cargo xfmt --check

  lint:
    name: 🤓 Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --workspace -- -D warnings

  # Due to platform differences I have opted out of using a matrix.
  # Examples;
  #   - Windows executables have different names
  #   - Linux glibc builds require containers (not used here but I use this as a template)
  build_linux_amd64:
    name: 🐥 Linux AMD64
    runs-on: ubuntu-latest
    needs:
      - version
      - format
      - lint
      - test
    env:
      VERSION: ${{needs.version.outputs.VERSION}}
      GITHUB_REPOSITORY_NAME: ${{needs.version.outputs.GITHUB_REPOSITORY_NAME}}
    steps:
      - uses: actions/checkout@v7
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
        with: { key: "x86_64-unknown-linux-musl" }
      - run: sudo apt-get update
      - run: sudo apt-get install -y musl-tools jq
      - run: rustup target add x86_64-unknown-linux-musl
      - run: sed "s/0.0.0-local/${VERSION}/g" "Cargo.toml" > "Cargo.toml.new" && mv "Cargo.toml.new" "Cargo.toml"
      - run: cargo build --target x86_64-unknown-linux-musl --release
      - run: |
          BIN_PATH="$(cargo build --target x86_64-unknown-linux-musl --release --message-format=json 2>/dev/null | jq -er 'select(.reason=="compiler-artifact" and .executable!=null) | .executable')";
          BIN_NAME="$(basename "${BIN_PATH}")"
          BIN_DIR="$(dirname "${BIN_PATH}")"
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          cd "$BIN_DIR"
          tar -czf "${GITHUB_WORKSPACE}/artifacts/${BIN_NAME}-linux-amd64.tar.gz" "${BIN_NAME}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.GITHUB_REPOSITORY_NAME }}-linux-amd64
          path: ${{ github.workspace }}/artifacts/**/*
          if-no-files-found: error
          retention-days: 1

  build_linux_arm64:
    name: 🐥 Linux ARM64
    runs-on: ubuntu-26.04-arm
    needs:
      - version
      - format
      - lint
      - test
    env:
      VERSION: ${{needs.version.outputs.VERSION}}
      GITHUB_REPOSITORY_NAME: ${{needs.version.outputs.GITHUB_REPOSITORY_NAME}}
    steps:
      - uses: actions/checkout@v7
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
        with: { key: "aarch64-unknown-linux-musl" }
      - run: sudo apt-get update
      - run: sudo apt-get install -y musl-tools jq
      - run: rustup target add aarch64-unknown-linux-musl
      - run: sed "s/0.0.0-local/${VERSION}/g" "Cargo.toml" > "Cargo.toml.new" && mv "Cargo.toml.new" "Cargo.toml"
      - run: cargo build --target aarch64-unknown-linux-musl --release
      - run: |
          BIN_PATH="$(cargo build --target aarch64-unknown-linux-musl --release --message-format=json 2>/dev/null | jq -er 'select(.reason=="compiler-artifact" and .executable!=null) | .executable')";
          BIN_NAME="$(basename "${BIN_PATH}")"
          BIN_DIR="$(dirname "${BIN_PATH}")"
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          cd "$BIN_DIR"
          tar -czf "${GITHUB_WORKSPACE}/artifacts/${BIN_NAME}-linux-arm64.tar.gz" "${BIN_NAME}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.GITHUB_REPOSITORY_NAME }}-linux-arm64
          path: ${{ github.workspace }}/artifacts/**/*
          if-no-files-found: error
          retention-days: 1

  build_macos_arm64:
    name: 🍎 MacOS ARM64
    runs-on: macos-latest
    needs:
      - version
      - format
      - lint
      - test
    env:
      VERSION: ${{needs.version.outputs.VERSION}}
      GITHUB_REPOSITORY_NAME: ${{needs.version.outputs.GITHUB_REPOSITORY_NAME}}
    steps:
      - uses: actions/checkout@v7
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
        with: { key: "aarch64-apple-darwin" }
      - run: rustup target add aarch64-apple-darwin
      - run: sed "s/0.0.0-local/${VERSION}/g" "Cargo.toml" > "Cargo.toml.new" && mv "Cargo.toml.new" "Cargo.toml"
      - run: cargo build --target aarch64-apple-darwin --release
      - run: |
          BIN_PATH="$(cargo build --target aarch64-apple-darwin --release --message-format=json 2>/dev/null | jq -er 'select(.reason=="compiler-artifact" and .executable!=null) | .executable')";
          BIN_NAME="$(basename "${BIN_PATH}")"
          BIN_DIR="$(dirname "${BIN_PATH}")"
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          cd "$BIN_DIR"
          tar -czf "${GITHUB_WORKSPACE}/artifacts/${BIN_NAME}-macos-arm64.tar.gz" "${BIN_NAME}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.GITHUB_REPOSITORY_NAME }}-macos-arm64
          path: ${{ github.workspace }}/artifacts/**/*
          if-no-files-found: error
          retention-days: 1

  build_windows_amd64:
    name: 🟦 Windows AMD64
    runs-on: windows-latest
    needs:
      - version
      - format
      - lint
      - test
    env:
      VERSION: ${{needs.version.outputs.VERSION}}
      GITHUB_REPOSITORY_NAME: ${{needs.version.outputs.GITHUB_REPOSITORY_NAME}}
    steps:
      - uses: actions/checkout@v7
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
        with: { key: "x86_64-pc-windows-msvc" }
      - run: rustup target add x86_64-pc-windows-msvc
      - run: sed "s/0.0.0-local/${VERSION}/g" "Cargo.toml" > "Cargo.toml.new" && mv "Cargo.toml.new" "Cargo.toml"
      - run: cargo build --target x86_64-pc-windows-msvc --release
      - run: |
          BIN_PATH="$(cargo build --target x86_64-pc-windows-msvc --release --message-format=json 2>/dev/null | jq -er 'select(.reason=="compiler-artifact" and .executable!=null) | .executable' | tr -d '\r')";
          BIN_PATH="$(cygpath -u "${BIN_PATH}")"
          BIN_NAME="$(basename "${BIN_PATH}")"
          BIN_DIR="$(dirname "${BIN_PATH}")"
          ARTIFACTS_DIR="$(cygpath -u "${GITHUB_WORKSPACE}")/artifacts"
          mkdir -p "${ARTIFACTS_DIR}"
          cd "$BIN_DIR"
          tar -czf "${ARTIFACTS_DIR}/${BIN_NAME%.exe}-windows-amd64.tar.gz" "${BIN_NAME}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.GITHUB_REPOSITORY_NAME }}-windows-amd64
          path: ${{ github.workspace }}/artifacts/**/*
          if-no-files-found: error
          retention-days: 1

  build_windows_arm64:
    name: 🟦 Windows ARM64
    runs-on: windows-latest
    needs:
      - version
      - format
      - lint
      - test
    env:
      VERSION: ${{needs.version.outputs.VERSION}}
      GITHUB_REPOSITORY_NAME: ${{needs.version.outputs.GITHUB_REPOSITORY_NAME}}
    steps:
      - uses: actions/checkout@v7
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
        with: { key: "aarch64-pc-windows-msvc" }
      - run: rustup target add aarch64-pc-windows-msvc
      - run: sed "s/0.0.0-local/${VERSION}/g" "Cargo.toml" > "Cargo.toml.new" && mv "Cargo.toml.new" "Cargo.toml"
      - run: cargo build --target aarch64-pc-windows-msvc --release
      - run: |
          BIN_PATH="$(cargo build --target aarch64-pc-windows-msvc --release --message-format=json 2>/dev/null | jq -er 'select(.reason=="compiler-artifact" and .executable!=null) | .executable' | tr -d '\r')";
          BIN_PATH="$(cygpath -u "${BIN_PATH}")"
          BIN_NAME="$(basename "${BIN_PATH}")"
          BIN_DIR="$(dirname "${BIN_PATH}")"
          ARTIFACTS_DIR="$(cygpath -u "${GITHUB_WORKSPACE}")/artifacts"
          mkdir -p "${ARTIFACTS_DIR}"
          cd "$BIN_DIR"
          tar -czf "${ARTIFACTS_DIR}/${BIN_NAME%.exe}-windows-arm64.tar.gz" "${BIN_NAME}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.GITHUB_REPOSITORY_NAME }}-windows-arm64
          path: ${{ github.workspace }}/artifacts/**/*
          if-no-files-found: error
          retention-days: 1

  publish_github_release:
    name: "🐱 Publish Github Release"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    needs:
      - build_linux_amd64
      - build_linux_arm64
      - build_macos_arm64
      - build_windows_amd64
      - build_windows_arm64
      - version
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish` Github Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{needs.version.outputs.VERSION}}
        run: |
          set -ex

          echo "Tag: ${VERSION}"

          gh release delete "$VERSION" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$VERSION" --draft --notes "Generating"
          gh release edit "$VERSION" --title "v${VERSION}"

          cd artifacts
          ls -la

          for name in *; do
            echo $name
            gh release upload "$VERSION" "$name"
          done

          gh release edit "$VERSION" --draft=false

  changelog:
    name: "📝 Generate Changelog"
    runs-on: ubuntu-latest
    needs:
      - version
      - publish_github_release
    steps:
      - uses: actions/checkout@v7
      - env:
          VERSION: ${{needs.version.outputs.VERSION}}
        run: |
          payload="$(jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg version "$VERSION" \
            '{repository: $repository, version: $version}')"

          curl -fsS -X POST "${{ secrets.SENTINEL_CHANGELOG_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "$payload" || true
